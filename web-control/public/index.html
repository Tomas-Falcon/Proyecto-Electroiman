<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElectroImán Control</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>Proyecto Electroimán</h1>
            <div id="status-badge" class="badge offline">Offline</div>
        </header>

        <nav class="tab-nav">
            <button class="tab-btn active" data-target="control-view">Control</button>
            <button class="tab-btn" data-target="logs-view">Logs</button>
        </nav>

        <main id="control-view" class="tab-content active">
            <section class="card main-control">
                <h2>Control Maestro (Soft Start/Stop)</h2>
                <div class="power-toggle">
                    <button id="btn-power" class="btn btn-off">ENCENDER SISTEMA</button>
                </div>
            </section>

            <section class="card modes">
                <h2>Modos de Operación</h2>
                <div class="mode-grid">
                    <button class="btn-mode active" data-mode="crucero">Crucero</button>
                    <button class="btn-mode" data-mode="carrera">Carrera</button>
                    <button class="btn-mode" data-mode="docking">Auto-Docking</button>
                    <button class="btn-mode" data-mode="alineacion">Alineacion</button>
                    <button class="btn-mode btn-warning" data-mode="experimental">Experimental</button>
                </div>
            </section>

            <!-- Solo visible en modo Experimental -->
            <section id="experimental-controls" class="card sliders" style="display: none;">
                <div class="slider-group">
                    <div class="slider-header">
                        <label>Altura Objetivo (Z)</label>
                        <span id="val-height-desc" class="status-text">Crucero</span>
                    </div>
                    <div class="value-display"><span id="val-height">20</span>mm</div>
                    <input type="range" id="range-height" min="10" max="60" value="20" step="5">
                </div>
                <div class="slider-group">
                    <label>Ajuste Eje Y (Offset): <span id="val-offset-y">0</span></label>
                    <input type="range" id="range-offset-y" min="-50" max="50" value="0">
                </div>
                <div class="mode-creator">
                    <button id="btn-save-draft" class="btn btn-small btn-accent">Guardar como Borrador</button>
                </div>
            </section>

            <!-- Solo visible en modo Alineacion -->
            <section id="alignment-panel" class="card alignment" style="display: none;">
                <h2>Panel de Alineacion Haptica</h2>
                <div class="alignment-grid">
                    <label><input type="checkbox" id="align-z" checked> Altura (Z)</label>
                    <label><input type="checkbox" id="align-rot" checked> Rotacion</label>
                    <label><input type="checkbox" id="align-speed"> Velocidad</label>
                </div>
                <div class="captured-values">
                    <p>Z: <span id="cap-z">--</span>mm</p>
                    <p>Rot: <span id="cap-rot">--</span>°</p>
                    <p>V: <span id="cap-speed">--</span>rpm</p>
                </div>
                <button id="btn-capture-config" class="btn btn-on">Capturar Configuracion</button>
            </section>

            <section class="card telemetry">
                <h2>Telemetría</h2>
                <div class="telemetry-grid">
                    <div class="tel-item">
                        <small>Core 0</small>
                        <span id="tel-core0">5.0 kHz</span>
                    </div>
                    <div class="tel-item">
                        <small>Temperatura</small>
                        <span id="tel-temp">-- °C</span>
                    </div>
                    <div class="tel-item">
                        <small>Batería Qi</small>
                        <span id="tel-batt">-- %</span>
                    </div>
                </div>
            </section>
        </main>

        <main id="logs-view" class="tab-content">
            <section class="card logs-container">
                <div class="logs-header">
                    <h2>Registros del Sistema</h2>
                    <div class="log-filters">
                        <select id="filter-type">
                            <option value="all">Todos</option>
                            <option value="info">Info</option>
                            <option value="instruction">Instruccion</option>
                            <option value="warning">Warning</option>
                            <option value="danger">Danger</option>
                        </select>
                        <button id="btn-clear-logs" class="btn-small">Limpiar</button>
                    </div>
                </div>
                <div id="log-list" class="log-list">
                    <!-- Los logs aparecerán aquí -->
                </div>
            </section>
        </main>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
